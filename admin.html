<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Food Management</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            margin: 0;
            padding: 30px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
        }

        input {
            padding: 10px;
            margin: 5px;
            width: 200px;
        }

        button {
            padding: 10px 15px;
            margin: 5px;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .add {
            background: green;
            color: white;
        }

        .update {
            background: orange;
            color: white;
        }

        .delete {
            background: red;
            color: white;
        }

        .food {
            border: 1px solid #ddd;
            margin-top: 10px;
            padding: 15px;
            border-radius: 5px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Food Management</h1>

    <h2>Add Food</h2>

    <input
        type="text"
        id="foodName"
        placeholder="Food Name"
    >

    <input
        type="number"
        id="foodPrice"
        placeholder="Price"
    >

    <button class="add" onclick="addFood()">
        Add Food
    </button>


    <h2>Update Food</h2>

    <input
        type="number"
        id="updateId"
        placeholder="Food ID"
    >

    <input
        type="text"
        id="updateName"
        placeholder="New Name"
    >

    <input
        type="number"
        id="updatePrice"
        placeholder="New Price"
    >

    <button class="update" onclick="updateFood()">
        Update Food
    </button>


    <h2>Food Items</h2>

    <div id="foodList"></div>

</div>


<script>

const API_URL = "/api/foods";

async function loadFoods() {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Failed to retrieve food items");
        }

        const foods = await response.json();

        const foodList = document.getElementById("foodList");

        foodList.innerHTML = "";

        foods.forEach(food => {

            foodList.innerHTML += `
                <div class="food">

                    <strong>${food.name}</strong>

                    <p>ID: ${food.id}</p>

                    <p>Price: ₹${food.price}</p>

                    <button
                        class="delete"
                        onclick="deleteFood(${food.id})">
                        Delete
                    </button>

                </div>
            `;

        });

    } catch (error) {

        console.error(error);

        alert("Unable to load food items");

    }

}


async function addFood() {

    const name =
        document.getElementById("foodName").value.trim();

    const price =
        document.getElementById("foodPrice").value;

    if (!name || !price) {

        alert("Enter food name and price");

        return;

    }

    try {

        const response = await fetch(API_URL, {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                name: name,
                price: Number(price)
            })

        });

        const result = await response.json();

        alert(result.message);

        if (response.ok) {

            document.getElementById("foodName").value = "";

            document.getElementById("foodPrice").value = "";

            loadFoods();

        }

    } catch (error) {

        console.error(error);

        alert("Unable to add food item");

    }

}


async function updateFood() {

    const id =
        document.getElementById("updateId").value;

    const name =
        document.getElementById("updateName").value.trim();

    const price =
        document.getElementById("updatePrice").value;

    if (!id) {

        alert("Enter food ID");

        return;

    }

    if (!name && !price) {

        alert("Enter a new name or price");

        return;

    }

    const data = {};

    if (name) {
        data.name = name;
    }

    if (price) {
        data.price = Number(price);
    }

    try {

        const response = await fetch(
            `${API_URL}/${id}`,
            {
                method: "PUT",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify(data)
            }
        );

        const result = await response.json();

        alert(result.message);

        if (response.ok) {

            document.getElementById("updateId").value = "";

            document.getElementById("updateName").value = "";

            document.getElementById("updatePrice").value = "";

            loadFoods();

        }

    } catch (error) {

        console.error(error);

        alert("Unable to update food item");

    }

}


async function deleteFood(id) {

    const confirmDelete =
        confirm("Do you want to delete this food item?");

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(
            `${API_URL}/${id}`,
            {
                method: "DELETE"
            }
        );

        const result = await response.json();

        alert(result.message);

        if (response.ok) {
            loadFoods();
        }

    } catch (error) {

        console.error(error);

        alert("Unable to delete food item");

    }

}


loadFoods();

</script>
</body>
</html>
